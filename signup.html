<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Your Account | VELORA Atelier Privé</title>
  <meta name="description" content="Join VELORA Atelier Privé to receive bespoke sizing concierge, invitations to limited silk capsules, and an inaugural 15% VIP welcome voucher." />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

  <!-- Google Fonts: Cormorant Garamond & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS CDN with Custom Luxury Brand Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            velora: {
              ivory: '#F8F4EF',
              champagne: '#E8D8C7',
              rose: '#C88F91',
              burgundy: '#572B3A',
              charcoal: '#252326',
              white: '#FFFFFF',
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            sans: ['"Montserrat"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-velora-ivory text-velora-charcoal dark:bg-[#1a181b] dark:text-velora-ivory antialiased selection:bg-velora-rose/30 h-screen w-screen overflow-hidden">

  <!-- Top Right Controls: RTL Toggle & Theme Toggle -->
  <div class="fixed top-4 right-4 sm:top-5 sm:right-5 flex items-center gap-2.5 z-50">
    <!-- RTL Toggle Button (Left-Right Arrow) -->
    <button
      id="rtl-toggle-btn"
      class="rtl-toggle-btn p-2.5 rounded-full border border-velora-champagne/80 dark:border-stone-700 bg-white/90 dark:bg-[#201d22]/90 backdrop-blur-md text-velora-charcoal dark:text-velora-ivory hover:text-velora-burgundy dark:hover:text-velora-rose hover:border-velora-burgundy dark:hover:border-velora-rose transition shadow-sm cursor-pointer"
      title="Toggle RTL Layout">
      <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
    </button>

    <!-- Theme Toggle (Light / Dark) -->
    <button
      class="theme-toggle-btn p-2.5 rounded-full border border-velora-champagne/80 dark:border-stone-700 bg-white/90 dark:bg-[#201d22]/90 backdrop-blur-md text-velora-charcoal dark:text-velora-ivory hover:text-velora-rose dark:hover:text-velora-champagne hover:border-velora-rose transition shadow-sm cursor-pointer"
      title="Toggle Theme">
      <i data-lucide="moon" class="theme-icon-moon w-4 h-4"></i>
      <i data-lucide="sun" class="theme-icon-sun w-4 h-4 hidden"></i>
    </button>
  </div>

  <!-- Ambient Backdrop Gradients -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-velora-champagne/50 dark:bg-velora-burgundy/20 filter blur-3xl opacity-70"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full bg-velora-rose/20 dark:bg-velora-rose/10 filter blur-3xl opacity-60"></div>
  </div>

  <!-- Fixed Viewport Container -->
  <main class="fixed inset-0 w-full h-full overflow-y-auto flex items-center justify-center p-4 z-10">

    <!-- Centered Authentication Card -->
    <div class="w-full max-w-md bg-white dark:bg-[#201d22] border border-velora-champagne/70 dark:border-velora-burgundy/40 rounded-3xl p-5 sm:p-6 shadow-2xl relative z-10 space-y-3 my-auto">
    
    <!-- Centered Brand Logo & Name (Side by Side) -->
    <div class="flex justify-center">
      <a href="index.html" class="inline-flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-full flex items-center justify-center p-1 bg-gradient-to-tr from-velora-burgundy via-velora-rose to-velora-champagne shadow-md group-hover:scale-105 transition-transform duration-300 shrink-0">
          <img src="assets/logo.svg" alt="VELORA Emblem" class="w-full h-full object-contain" />
        </div>
        <div class="flex flex-col text-left rtl:text-right">
          <span class="font-serif text-2xl font-semibold tracking-[0.22em] text-velora-burgundy dark:text-velora-champagne transition-colors">VELORA</span>
          <span class="text-[9px] tracking-[0.35em] uppercase text-velora-rose dark:text-velora-champagne/70 -mt-1 font-medium">ATELIER PRIVÉ</span>
        </div>
      </a>
    </div>

    <!-- Header Text -->
    <div class="text-center space-y-1">
      <span class="text-[10px] uppercase tracking-[0.25em] text-velora-rose font-semibold">Begin Your Journey</span>
      <h1 class="font-serif text-2xl sm:text-3xl font-normal text-velora-charcoal dark:text-velora-ivory leading-tight">
        Create Your Account
      </h1>
      <p class="text-xs text-stone-500 dark:text-stone-400">
        Unlock exclusive privileges, biometric profiles, and private access.
      </p>
    </div>

    <!-- Signup Form -->
    <form id="signup-form" class="space-y-4" onsubmit="event.preventDefault(); showToast('Welcome to VELORA Privé! Your 15% VIP welcome code has been emailed to you.', 'success'); setTimeout(() => { window.location.href = 'index.html'; }, 1500);">
      
      <!-- Full Name -->
      <div>
        <label for="signup-name" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 dark:text-stone-300 mb-1.5">
          Full Name
        </label>
        <div class="relative">
          <input
            type="text"
            id="signup-name"
            required
            placeholder="Claire Laurent"
            class="w-full px-4 py-3 pl-11 rounded-xl bg-stone-50 dark:bg-stone-800/60 border border-velora-champagne/60 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-velora-rose text-velora-charcoal dark:text-velora-ivory transition"
          />
          <i data-lucide="user" class="w-4 h-4 text-stone-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
        </div>
      </div>

      <!-- Email Input -->
      <div>
        <label for="signup-email" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 dark:text-stone-300 mb-1.5">
          Email Address
        </label>
        <div class="relative">
          <input
            type="email"
            id="signup-email"
            required
            placeholder="claire@atelier-velora.com"
            class="w-full px-4 py-3 pl-11 rounded-xl bg-stone-50 dark:bg-stone-800/60 border border-velora-champagne/60 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-velora-rose text-velora-charcoal dark:text-velora-ivory transition"
          />
          <i data-lucide="mail" class="w-4 h-4 text-stone-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
        </div>
      </div>

      <!-- Preferred Collection Selector -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 dark:text-stone-300 mb-1.5">
          Primary Wardrobe Interest
        </label>
        <div class="grid grid-cols-3 gap-2">
          <label class="cursor-pointer">
            <input type="radio" name="preference" value="women" checked class="peer sr-only" />
            <span class="block py-2 text-center text-xs font-medium rounded-xl border border-stone-200 dark:border-stone-700 peer-checked:border-velora-burgundy peer-checked:bg-velora-burgundy peer-checked:text-white dark:peer-checked:bg-velora-rose dark:peer-checked:text-velora-charcoal transition">
              Women's
            </span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="preference" value="men" class="peer sr-only" />
            <span class="block py-2 text-center text-xs font-medium rounded-xl border border-stone-200 dark:border-stone-700 peer-checked:border-velora-burgundy peer-checked:bg-velora-burgundy peer-checked:text-white dark:peer-checked:bg-velora-rose dark:peer-checked:text-velora-charcoal transition">
              Men's
            </span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="preference" value="both" class="peer sr-only" />
            <span class="block py-2 text-center text-xs font-medium rounded-xl border border-stone-200 dark:border-stone-700 peer-checked:border-velora-burgundy peer-checked:bg-velora-burgundy peer-checked:text-white dark:peer-checked:bg-velora-rose dark:peer-checked:text-velora-charcoal transition">
              Both
            </span>
          </label>
        </div>
      </div>

      <!-- Password Input with Strength & Toggle -->
      <div>
        <label for="signup-password" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 dark:text-stone-300 mb-1.5">
          Password
        </label>
        <div class="relative">
          <input
            type="password"
            id="signup-password"
            required
            minlength="8"
            placeholder="At least 8 characters"
            oninput="const val = this.value; const bar = document.getElementById('pw-strength-bar'); const txt = document.getElementById('pw-strength-txt'); if(val.length === 0){ bar.style.width='0%'; txt.textContent=''; } else if(val.length < 8){ bar.style.width='33%'; bar.className='h-full bg-rose-400 transition-all'; txt.textContent='Weak'; } else if(/[A-Z]/.test(val) && /[0-9]/.test(val)){ bar.style.width='100%'; bar.className='h-full bg-emerald-500 transition-all'; txt.textContent='Strong'; } else { bar.style.width='66%'; bar.className='h-full bg-amber-400 transition-all'; txt.textContent='Medium'; }"
            class="w-full px-4 py-3 pl-11 pr-11 rounded-xl bg-stone-50 dark:bg-stone-800/60 border border-velora-champagne/60 dark:border-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-velora-rose text-velora-charcoal dark:text-velora-ivory transition"
          />
          <i data-lucide="lock" class="w-4 h-4 text-stone-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
          <button
            type="button"
            onclick="const p = document.getElementById('signup-password'); p.type = p.type === 'password' ? 'text' : 'password';"
            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-velora-charcoal dark:hover:text-velora-ivory transition p-1 cursor-pointer"
            title="Toggle Password Visibility">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
        <!-- Strength bar -->
        <div class="flex items-center justify-between mt-1.5">
          <div class="h-1 w-32 bg-stone-200 dark:bg-stone-700 rounded-full overflow-hidden">
            <div id="pw-strength-bar" class="h-full bg-transparent transition-all" style="width: 0%;"></div>
          </div>
          <span id="pw-strength-txt" class="text-[10px] text-stone-400 font-medium"></span>
        </div>
      </div>

      <!-- Terms & Opt-in Checkboxes -->
      <div class="space-y-2 pt-1 text-xs text-stone-500 dark:text-stone-400">
        <label class="flex items-start gap-2 cursor-pointer">
          <input type="checkbox" required checked class="mt-0.5 w-4 h-4 rounded text-velora-burgundy focus:ring-velora-rose border-stone-300 dark:border-stone-600 shrink-0" />
          <span>I agree to the <a href="#" class="text-velora-burgundy dark:text-velora-rose underline">Terms of Privé Membership</a> and <a href="#" class="text-velora-burgundy dark:text-velora-rose underline">Privacy Policy</a>.</span>
        </label>
        <label class="flex items-start gap-2 cursor-pointer">
          <input type="checkbox" checked class="mt-0.5 w-4 h-4 rounded text-velora-burgundy focus:ring-velora-rose border-stone-300 dark:border-stone-600 shrink-0" />
          <span>Receive discreet invitations to limited fabric releases & 15% VIP welcome voucher.</span>
        </label>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button
          type="submit"
          class="w-full py-3.5 px-6 rounded-full bg-velora-burgundy text-white hover:bg-velora-rose dark:bg-velora-rose dark:text-velora-charcoal dark:hover:bg-velora-champagne font-semibold text-xs uppercase tracking-widest transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2 group cursor-pointer">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>Create Atelier Account</span>
        </button>
      </div>
    </form>

    <!-- Divider (OR CONTINUE WITH) -->
    <div class="relative flex items-center justify-center my-3">
      <div class="border-t border-stone-200 dark:border-stone-700 w-full"></div>
      <span class="bg-white dark:bg-[#201d22] px-3 text-[10px] uppercase tracking-wider text-stone-400 shrink-0 font-medium">Or continue with</span>
      <div class="border-t border-stone-200 dark:border-stone-700 w-full"></div>
    </div>

    <!-- Social Registration (Icon-Only with Hover Effects: Apple, Facebook, Google) -->
    <div class="flex items-center justify-center gap-4">
      <!-- Apple -->
      <button
        type="button"
        onclick="showToast('Apple ID Registration initialized.', 'info')"
        class="w-12 h-12 rounded-2xl flex items-center justify-center border border-stone-200 dark:border-stone-700 bg-stone-50/70 dark:bg-stone-800/40 text-velora-charcoal dark:text-velora-ivory hover:text-black dark:hover:text-white hover:border-velora-burgundy dark:hover:border-velora-rose hover:bg-white dark:hover:bg-stone-800 hover:-translate-y-1 hover:shadow-lg transition-all duration-300 group cursor-pointer"
        title="Register with Apple">
        <svg class="w-5 h-5 fill-current transition-transform duration-300 group-hover:scale-110" viewBox="0 0 24 24">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 3.5c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.73 1 .08 2.03-.48 2.65-1.23z"/>
        </svg>
      </button>

      <!-- Facebook -->
      <button
        type="button"
        onclick="showToast('Facebook Registration initialized.', 'info')"
        class="w-12 h-12 rounded-2xl flex items-center justify-center border border-stone-200 dark:border-stone-700 bg-stone-50/70 dark:bg-stone-800/40 text-[#1877F2] hover:border-[#1877F2] hover:bg-white dark:hover:bg-stone-800 hover:-translate-y-1 hover:shadow-lg transition-all duration-300 group cursor-pointer"
        title="Register with Facebook">
        <svg class="w-5 h-5 fill-current transition-transform duration-300 group-hover:scale-110" viewBox="0 0 24 24">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </button>

      <!-- Google -->
      <button
        type="button"
        onclick="showToast('Google Registration initialized.', 'info')"
        class="w-12 h-12 rounded-2xl flex items-center justify-center border border-stone-200 dark:border-stone-700 bg-stone-50/70 dark:bg-stone-800/40 hover:border-velora-burgundy dark:hover:border-velora-rose hover:bg-white dark:hover:bg-stone-800 hover:-translate-y-1 hover:shadow-lg transition-all duration-300 group cursor-pointer"
        title="Register with Google">
        <svg class="w-5 h-5 transition-transform duration-300 group-hover:scale-110" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
      </button>
    </div>

    <!-- Bottom Redirect -->
    <div class="text-center pt-3 border-t border-velora-champagne/40 text-xs text-stone-500 dark:text-stone-400">
      Already an Atelier Member?
      <a href="login.html" class="font-semibold text-velora-burgundy dark:text-velora-rose hover:underline ml-1">
        Sign In
      </a>
    </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
